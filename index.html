<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d1117" />
  <title>FPV Voice Commands</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-2: #1f2937;
      --text: #f8fafc;
      --muted: #94a3b8;
      --blue: #2563eb;
      --blue-2: #1d4ed8;
      --green: #16a34a;
      --green-2: #15803d;
      --orange: #ea580c;
      --orange-2: #c2410c;
      --red: #dc2626;
      --red-2: #b91c1c;
      --border: rgba(255,255,255,.12);
      --shadow: 0 14px 35px rgba(0,0,0,.45);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }

    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .app {
      position: relative;
      width: 100vw;
      height: 100dvh;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #172033 0%, #0d1117 55%);
      overflow: hidden;
    }

    .stage {
      position: absolute;
      inset: 8px 8px 8px 8px;
      display: grid;
      grid-template-columns: 1.05fr 1fr 1.05fr;
      grid-template-rows: 1fr 1fr;
      gap: 8px;
    }

    .axis {
      position: relative;
      background: rgba(22, 27, 34, .78);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 34px 10px 10px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
      min-width: 0;
      min-height: 0;
    }

    .axis-title {
      position: absolute;
      top: 8px;
      left: 12px;
      right: 12px;
      text-align: center;
      font-size: clamp(13px, 2vw, 18px);
      font-weight: 900;
      letter-spacing: .12em;
      color: #e5e7eb;
      opacity: .95;
      pointer-events: none;
    }

    .throttle { grid-column: 1; grid-row: 1 / span 2; }
    .yaw { grid-column: 2; grid-row: 1; }
    .roll { grid-column: 2; grid-row: 2; }
    .pitch { grid-column: 3; grid-row: 1 / span 2; }

    .vgrid {
      height: 100%;
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: 8px;
    }

    .hgrid {
      height: 100%;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 7px;
      align-items: stretch;
    }

    .extras {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;
      height: 82px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      pointer-events: none;
      opacity: 0;
    }

    button.cmd {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 14px;
      color: white;
      font-size: clamp(12px, 1.75vw, 18px);
      line-height: 1.05;
      font-weight: 850;
      letter-spacing: -.02em;
      text-align: center;
      padding: 7px 6px;
      box-shadow: 0 5px 0 rgba(0,0,0,.28), 0 11px 22px rgba(0,0,0,.22);
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }

    button.cmd:active {
      transform: translateY(4px) scale(.985);
      box-shadow: 0 1px 0 rgba(0,0,0,.28), 0 5px 12px rgba(0,0,0,.24);
      filter: brightness(1.12);
    }

    .blue { background: linear-gradient(180deg, var(--blue), var(--blue-2)); }
    .green { background: linear-gradient(180deg, var(--green), var(--green-2)); }
    .orange { background: linear-gradient(180deg, var(--orange), var(--orange-2)); }
    .red { background: linear-gradient(180deg, var(--red), var(--red-2)); }

    .small-label {
      display: block;
      margin-top: 4px;
      font-size: .72em;
      font-weight: 700;
      opacity: .75;
    }

    .settings-btn {
      position: fixed;
      left: calc(10px + env(safe-area-inset-left));
      bottom: calc(10px + env(safe-area-inset-bottom));
      z-index: 50;
      width: 52px;
      height: 52px;
      border-radius: 18px;
      border: 1px solid var(--border);
      color: white;
      background: rgba(31,41,55,.92);
      backdrop-filter: blur(16px);
      font-size: 26px;
      box-shadow: var(--shadow);
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0,0,0,.28);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
    }

    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      z-index: 70;
      top: 0;
      bottom: 0;
      left: 0;
      width: min(390px, 92vw);
      padding: calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
      background: rgba(15,23,42,.98);
      border-right: 1px solid var(--border);
      box-shadow: var(--shadow);
      transform: translateX(-105%);
      transition: transform .22s ease;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .drawer.open { transform: translateX(0); }

    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .drawer-title {
      font-size: 22px;
      font-weight: 900;
    }

    .close-btn {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.08);
      color: white;
      font-size: 24px;
    }

    .field { margin: 14px 0; }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
      margin: 0 0 7px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    select, input[type="range"] {
      width: 100%;
      min-height: 46px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #111827;
      color: white;
      padding: 0 12px;
      font-size: 16px;
    }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .test-btn {
      width: 100%;
      height: 48px;
      margin-top: 10px;
      border: 0;
      border-radius: 14px;
      color: white;
      background: linear-gradient(180deg, #475569, #334155);
      font-size: 16px;
      font-weight: 850;
    }

    .hint {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.35;
      color: var(--muted);
    }

    .status {
      position: fixed;
      left: 50%;
      bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 45;
      transform: translateX(-50%);
      max-width: 70vw;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(0,0,0,.55);
      color: white;
      font-weight: 800;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status.show { opacity: 1; }

    @media (orientation: portrait) {
      .app::before {
        content: "Поверни телефон горизонтально";
        position: fixed;
        z-index: 90;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        font-size: 28px;
        font-weight: 900;
        background: #0d1117;
        color: white;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="stage" aria-label="FPV voice command panel">
      <div class="axis throttle">
        <div class="axis-title">THROTTLE</div>
        <div class="vgrid">
          <button class="cmd green" data-key="throttle_up_small">Трохи більше<br>газу<span class="small-label">+ chico</span></button>
          <button class="cmd green" data-key="throttle_up_medium">Більше<br>газу<span class="small-label">+ mediano</span></button>

          <button class="cmd red" data-key="throttle_down_small">Трохи менше<br>газу<span class="small-label">- chico</span></button>
          <button class="cmd red" data-key="throttle_down_medium">Менше<br>газу<span class="small-label">- mediano</span></button>
          <button class="cmd red" data-key="throttle_down_big">Сильно менше<br>газу<span class="small-label">- grande</span></button>
        </div>
      </div>

      <div class="axis yaw">
        <div class="axis-title">YAW</div>
        <div class="hgrid">
          <button class="cmd blue" data-key="yaw_left_big">Ліворуч<br>сильно</button>
          <button class="cmd blue" data-key="yaw_left_medium">Ліворуч<br>більше</button>
          <button class="cmd blue" data-key="yaw_left_small">Ліворуч<br>трохи</button>
          <button class="cmd orange" data-key="yaw_right_small">Праворуч<br>трохи</button>
          <button class="cmd orange" data-key="yaw_right_medium">Праворуч<br>більше</button>
          <button class="cmd orange" data-key="yaw_right_big">Праворуч<br>сильно</button>
        </div>
      </div>

      <div class="axis roll">
        <div class="axis-title">ROLL</div>
        <div class="hgrid">
          <button class="cmd blue" data-key="roll_left_big">Ліворуч<br>сильно</button>
          <button class="cmd blue" data-key="roll_left_medium">Ліворуч<br>більше</button>
          <button class="cmd blue" data-key="roll_left_small">Ліворуч<br>трохи</button>
          <button class="cmd orange" data-key="roll_right_small">Праворуч<br>трохи</button>
          <button class="cmd orange" data-key="roll_right_medium">Праворуч<br>більше</button>
          <button class="cmd orange" data-key="roll_right_big">Праворуч<br>сильно</button>
        </div>
      </div>

      <div class="axis pitch">
        <div class="axis-title">PITCH</div>
        <div class="vgrid">
          <button class="cmd green" data-key="pitch_up_small">Вгору<br>трохи<span class="small-label">arriba chico</span></button>
          <button class="cmd green" data-key="pitch_up_medium">Вгору<br>більше<span class="small-label">arriba mediano</span></button>
          <button class="cmd green" data-key="pitch_up_big">Вгору<br>сильно<span class="small-label">arriba grande</span></button>
          <button class="cmd red" data-key="pitch_down_small">Вниз<br>трохи<span class="small-label">abajo chico</span></button>
          <button class="cmd red" data-key="pitch_down_medium">Вниз<br>більше<span class="small-label">abajo mediano</span></button>
          <button class="cmd red" data-key="pitch_down_big">Вниз<br>сильно<span class="small-label">abajo grande</span></button>
        </div>
      </div>
    </section>

    <button class="settings-btn" id="settingsBtn" aria-label="Settings">⚙</button>
    <div class="status" id="status"></div>
  </main>

  <div class="drawer-backdrop" id="backdrop"></div>
  <aside class="drawer" id="drawer" aria-label="Settings panel">
    <div class="drawer-head">
      <div class="drawer-title">Налаштування</div>
      <button class="close-btn" id="closeBtn" aria-label="Close">×</button>
    </div>

    <div class="field">
      <label for="languageSelect">Мова озвучення</label>
      <select id="languageSelect"></select>
    </div>

    <div class="field">
      <label for="genderSelect">Голос</label>
      <select id="genderSelect">
        <option value="auto">Auto</option>
        <option value="male" selected>Чоловічий</option>
        <option value="female">Жіночий</option>
      </select>
    </div>

    <div class="field">
      <label for="voiceSelect">Доступні системні голоси</label>
      <select id="voiceSelect"></select>
    </div>

    <div class="row">
      <div class="field">
        <label for="rateRange">Швидкість</label>
        <input id="rateRange" type="range" min="0.65" max="1.25" value="0.9" step="0.05" />
      </div>
      <div class="field">
        <label for="volumeRange">Гучність</label>
        <input id="volumeRange" type="range" min="0" max="1" value="1" step="0.05" />
      </div>
    </div>

    <button class="test-btn" id="testBtn">Тест голосу</button>
    <div class="hint">
      На iPhone якість залежить від встановлених системних голосів. Для кращого звуку відкрий iOS Settings → Accessibility → Spoken Content → Voices і завантаж потрібні голоси.
    </div>
  </aside>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>

    ];

    const COMMANDS = {
      'es-ES': {
        throttle_up_small: 'Throttle más chico', throttle_up_medium: 'Throttle más mediano', throttle_up_big: 'Throttle más grande',
        throttle_down_small: 'Throttle menos chico', throttle_down_medium: 'Throttle menos mediano', throttle_down_big: 'Throttle menos grande',
        yaw_left_big: 'Yaw izquierda grande', yaw_left_medium: 'Yaw izquierda mediano', yaw_left_small: 'Yaw izquierda chico',
        yaw_right_small: 'Yaw derecha chico', yaw_right_medium: 'Yaw derecha mediano', yaw_right_big: 'Yaw derecha grande',
        roll_left_big: 'Roll izquierda grande', roll_left_medium: 'Roll izquierda mediano', roll_left_small: 'Roll izquierda chico',
        roll_right_small: 'Roll derecha chico', roll_right_medium: 'Roll derecha mediano', roll_right_big: 'Roll derecha grande',
        pitch_up_small: 'Pitch arriba chico', pitch_up_medium: 'Pitch arriba mediano', pitch_up_big: 'Pitch arriba grande',
        pitch_down_small: 'Pitch abajo chico', pitch_down_medium: 'Pitch abajo mediano', pitch_down_big: 'Pitch abajo grande',
        test: 'Yaw derecha grande'
      },
      'uk-UA': {

        throttle_down_small: 'Throttle трохи менше', throttle_down_medium: 'Throttle менше', throttle_down_big: 'Throttle сильно менше',
        yaw_left_big: 'Yaw сильно ліворуч', yaw_left_medium: 'Yaw більше ліворуч', yaw_left_small: 'Yaw трохи ліворуч',
        yaw_right_small: 'Yaw трохи праворуч', yaw_right_medium: 'Yaw більше праворуч', yaw_right_big: 'Yaw сильно праворуч',
        roll_left_big: 'Roll сильно ліворуч', roll_left_medium: 'Roll більше ліворуч', roll_left_small: 'Roll трохи ліворуч',
        roll_right_small: 'Roll трохи праворуч', roll_right_medium: 'Roll більше праворуч', roll_right_big: 'Roll сильно праворуч',
        pitch_up_small: 'Pitch трохи вгору', pitch_up_medium: 'Pitch більше вгору', pitch_up_big: 'Pitch сильно вгору',
        pitch_down_small: 'Pitch трохи вниз', pitch_down_medium: 'Pitch більше вниз', pitch_down_big: 'Pitch сильно вниз',
        test: 'Yaw сильно праворуч'
      },
      'en-US': {
        throttle_up_small: 'Throttle up small', throttle_up_medium: 'Throttle up medium', throttle_up_big: 'Throttle up large',
        throttle_down_small: 'Throttle down small', throttle_down_medium: 'Throttle down medium', throttle_down_big: 'Throttle down large',
        yaw_left_big: 'Yaw left large', yaw_left_medium: 'Yaw left medium', yaw_left_small: 'Yaw left small',
        yaw_right_small: 'Yaw right small', yaw_right_medium: 'Yaw right medium', yaw_right_big: 'Yaw right large',
        roll_left_big: 'Roll left large', roll_left_medium: 'Roll left medium', roll_left_small: 'Roll left small',
        roll_right_small: 'Roll right small', roll_right_medium: 'Roll right medium', roll_right_big: 'Roll right large',
        pitch_up_small: 'Pitch up small', pitch_up_medium: 'Pitch up medium', pitch_up_big: 'Pitch up large',
        pitch_down_small: 'Pitch down small', pitch_down_medium: 'Pitch down medium', pitch_down_big: 'Pitch down large',
        test: 'Yaw right large'
      }

    const SIMPLE_WORDS = {
      'fr': { left:'gauche', right:'droite', up:'haut', down:'bas', small:'petit', medium:'moyen', big:'grand', more:'plus', less:'moins' },
      'de': { left:'links', right:'rechts', up:'hoch', down:'runter', small:'klein', medium:'mittel', big:'groß', more:'mehr', less:'weniger' },
      'it': { left:'sinistra', right:'destra', up:'su', down:'giù', small:'piccolo', medium:'medio', big:'grande', more:'più', less:'meno' },
      'pt': { left:'esquerda', right:'direita', up:'cima', down:'baixo', small:'pequeno', medium:'médio', big:'grande', more:'mais', less:'menos' },
      'pl': { left:'lewo', right:'prawo', up:'góra', down:'dół', small:'mały', medium:'średni', big:'duży', more:'więcej', less:'mniej' },
      'ja': { left:'左', right:'右', up:'上', down:'下', small:'小さく', medium:'中くらい', big:'大きく', more:'もっと', less:'少なく' },
      'ko': { left:'왼쪽', right:'오른쪽', up:'위로', down:'아래로', small:'작게', medium:'중간', big:'크게', more:'더', less:'덜' },
      'zh': { left:'左', right:'右', up:'上', down:'下', small:'小', medium:'中', big:'大', more:'更多', less:'更少' }
    };

    let voices = [];
    let selectedVoiceName = '';
    const languageSelect = document.getElementById('languageSelect');
    const genderSelect = document.getElementById('genderSelect');
    const voiceSelect = document.getElementById('voiceSelect');
    const rateRange = document.getElementById('rateRange');
    const volumeRange = document.getElementById('volumeRange');
    const statusEl = document.getElementById('status');
    const drawer = document.getElementById('drawer');
    const drawerBackdrop = document.getElementById('drawerBackdrop');

    function initLanguages() {
      languageSelect.innerHTML = LANGUAGES.map(l => `<option value="${l.code}">${l.label}</option>`).join('');
      languageSelect.value = localStorage.getItem('fpv-language') || 'es-ES';
    }

    function loadVoices() {
      voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
      updateVoiceList();
    }

    function scoreVoice(voice, langCode, gender) {
      const name = (voice.name || '').toLowerCase();
      const lang = (voice.lang || '').toLowerCase();
      const base = langCode.toLowerCase().split('-')[0];
      let score = 0;
      if (lang === langCode.toLowerCase()) score += 100;
      if (lang.startsWith(base)) score += 60;
      if (voice.localService) score += 8;
      const maleHints = ['jorge','diego','carlos','juan','paul','daniel','thomas','mark','alex','male','homme','männlich','hombre'];
      const femaleHints = ['monica','mónica','paulina','maria','anna','samantha','sara','female','femme','weiblich','mujer'];
      if (gender === 'male' && maleHints.some(h => name.includes(h))) score += 35;
      if (gender === 'female' && femaleHints.some(h => name.includes(h))) score += 35;
      return score;
    }

    function updateVoiceList() {
      const langCode = languageSelect.value;
      const base = langCode.split('-')[0].toLowerCase();
      const matched = voices.filter(v => (v.lang || '').toLowerCase().startsWith(base));
      const list = matched.length ? matched : voices;
      voiceSelect.innerHTML = '';
      if (!list.length) {
        voiceSelect.innerHTML = '<option value="">Системні голоси ще завантажуються</option>';
        return;
      }
      list.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.name;
        opt.textContent = `${v.name} — ${v.lang}`;
        voiceSelect.appendChild(opt);
      });
      const saved = localStorage.getItem('fpv-voice-name');
      if (saved && list.some(v => v.name === saved)) {
        voiceSelect.value = saved;
        selectedVoiceName = saved;
        return;
      }
      const gender = genderSelect.value;
      const best = [...list].sort((a,b) => scoreVoice(b, langCode, gender) - scoreVoice(a, langCode, gender))[0];
      if (best) {
        voiceSelect.value = best.name;
        selectedVoiceName = best.name;
      }
    }

    function getVoice() {
      return voices.find(v => v.name === selectedVoiceName) || null;
    }

    function getCommandText(key) {
      const lang = languageSelect.value;
      if (COMMANDS[lang] && COMMANDS[lang][key]) return COMMANDS[lang][key];
      const base = lang.split('-')[0];
      const w = SIMPLE_WORDS[base] || SIMPLE_WORDS['fr'];
      const map = {
        throttle_up_small: `Throttle ${w.more} ${w.small}`,
        throttle_up_medium: `Throttle ${w.more} ${w.medium}`,
        throttle_up_big: `Throttle ${w.more} ${w.big}`,
        throttle_down_small: `Throttle ${w.less} ${w.small}`,
        throttle_down_medium: `Throttle ${w.less} ${w.medium}`,
        throttle_down_big: `Throttle ${w.less} ${w.big}`,
        yaw_left_big: `Yaw ${w.left} ${w.big}`,
        yaw_left_medium: `Yaw ${w.left} ${w.medium}`,
        yaw_left_small: `Yaw ${w.left} ${w.small}`,
        yaw_right_small: `Yaw ${w.right} ${w.small}`,
        yaw_right_medium: `Yaw ${w.right} ${w.medium}`,
        yaw_right_big: `Yaw ${w.right} ${w.big}`,
        roll_left_big: `Roll ${w.left} ${w.big}`,
        roll_left_medium: `Roll ${w.left} ${w.medium}`,
        roll_left_small: `Roll ${w.left} ${w.small}`,
        roll_right_small: `Roll ${w.right} ${w.small}`,
        roll_right_medium: `Roll ${w.right} ${w.medium}`,
        roll_right_big: `Roll ${w.right} ${w.big}`,
        pitch_up_small: `Pitch ${w.up} ${w.small}`,
        pitch_up_medium: `Pitch ${w.up} ${w.medium}`,
        pitch_up_big: `Pitch ${w.up} ${w.big}`,
        pitch_down_small: `Pitch ${w.down} ${w.small}`,
        pitch_down_medium: `Pitch ${w.down} ${w.medium}`,
        pitch_down_big: `Pitch ${w.down} ${w.big}`,
        test: `Yaw ${w.right} ${w.big}`
      };
      return map[key] || key;
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) {
        showStatus('SpeechSynthesis не підтримується');
        return;
      }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = languageSelect.value;
      u.rate = Number(rateRange.value);
      u.pitch = 0.95;
      u.volume = Number(volumeRange.value);
      const voice = getVoice();
      if (voice) u.voice = voice;
      speechSynthesis.speak(u);
      showStatus(text);
    }

    let statusTimer;
    function showStatus(text) {
      statusEl.textContent = text;
      statusEl.classList.add('show');
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => statusEl.classList.remove('show'), 1300);
    }

    function openDrawer() {
      drawer.classList.add('open');
      drawerBackdrop.classList.add('open');
    }

    function closeDrawer() {
      drawer.classList.remove('open');
      drawerBackdrop.classList.remove('open');
    }

    document.querySelectorAll('button.cmd').forEach(btn => {
      btn.addEventListener('click', () => speak(getCommandText(btn.dataset.key)));
    });

    document.getElementById('settingsBtn').addEventListener('click', openDrawer);
    document.getElementById('closeBtn').addEventListener('click', closeDrawer);
    drawerBackdrop.addEventListener('click', closeDrawer);
    document.getElementById('testBtn').addEventListener('click', () => speak(getCommandText('test')));

    languageSelect.addEventListener('change', () => {
      localStorage.setItem('fpv-language', languageSelect.value);
      localStorage.removeItem('fpv-voice-name');
      selectedVoiceName = '';
      updateVoiceList();
    });

    genderSelect.addEventListener('change', () => {
      localStorage.setItem('fpv-gender', genderSelect.value);
      localStorage.removeItem('fpv-voice-name');
      selectedVoiceName = '';
      updateVoiceList();
    });

    voiceSelect.addEventListener('change', () => {
      selectedVoiceName = voiceSelect.value;
      localStorage.setItem('fpv-voice-name', selectedVoiceName);
    });

    rateRange.addEventListener('input', () => localStorage.setItem('fpv-rate', rateRange.value));
    volumeRange.addEventListener('input', () => localStorage.setItem('fpv-volume', volumeRange.value));

    initLanguages();
    genderSelect.value = localStorage.getItem('fpv-gender') || 'male';
    rateRange.value = localStorage.getItem('fpv-rate') || '0.9';
    volumeRange.value = localStorage.getItem('fpv-volume') || '1';
    loadVoices();
    if ('speechSynthesis' in window) {
      speechSynthesis.onvoiceschanged = loadVoices;
      setTimeout(loadVoices, 250);
      setTimeout(loadVoices, 1000);
    }
  </script>
</body>
</html>
