<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1f2329">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="FPV Voice" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FPV Voice Commands</title>
  <style>
    :root{
      --bg:#1f2329;
      --purple:#a51685;
      --red:#c33535;
      --red2:#c95f5f;
      --red3:#d58383;
      --blue:#3a82e5;
      --blue2:#82aeea;
      --blue3:#aac7ef;
      --green:#33a44f;
      --green2:#73bd80;
      --green3:#b4dbba;
      --yellow:#ecb930;
      --yellow2:#f0cf7e;
      --yellow3:#f5dfa8;
      --gray:#d8d8d8;
      --black:#0c0c0c;
      --white:#fff;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Arial, Helvetica, sans-serif;color:var(--black)}
    body{position:fixed;inset:0}
    .app{position:fixed;left:env(safe-area-inset-left);top:env(safe-area-inset-top);right:env(safe-area-inset-right);bottom:env(safe-area-inset-bottom);background:var(--bg);overflow:hidden}
    .board{position:absolute;left:0;top:0;width:1600px;height:900px;background:var(--bg);transform-origin:top left;will-change:transform}
    button{position:absolute;border:0;border-radius:22px;font-weight:900;text-transform:none;text-align:center;line-height:1.08;font-size:26px;padding:0 14px;display:flex;align-items:center;justify-content:center;color:var(--black);box-shadow:none;cursor:pointer;user-select:none;-webkit-user-select:none}
    button:active{transform:scale(.96);filter:brightness(.92)}
    .top{background:var(--purple);color:var(--white);font-size:24px;border-radius:20px}
    .red{background:var(--red);color:var(--white)} .red2{background:var(--red2);color:var(--white)} .red3{background:var(--red3);color:var(--white)}
    .blue{background:var(--blue)} .blue2{background:var(--blue2)} .blue3{background:var(--blue3)}
    .green{background:var(--green)} .green2{background:var(--green2)} .green3{background:var(--green3)}
    .yellow{background:var(--yellow)} .yellow2{background:var(--yellow2)} .yellow3{background:var(--yellow3)}
    .gray{background:var(--gray)} .white{background:#fff}
    .pill{border-radius:18px}
    .vertical{writing-mode:vertical-rl;text-orientation:mixed}
    .small{font-size:22px}.mid{font-size:24px}.big{font-size:28px}
    #rotateHint{display:none;position:fixed;inset:0;background:#1f2329;color:white;z-index:20;align-items:center;justify-content:center;text-align:center;font:800 26px/1.25 Arial;padding:30px}
    .settingsToggle{position:fixed;left:calc(12px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));z-index:12;width:58px;height:58px;border-radius:18px;background:#252a32;color:#fff;font:900 26px Arial;border:0;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.22);text-transform:none;padding:0}
    .settingsToggle:active{transform:scale(.96)}
    .voicePanel{position:fixed;left:0;top:0;bottom:0;width:min(360px,86vw);z-index:11;background:rgba(255,255,255,.97);border-right:1px solid rgba(0,0,0,.18);padding:calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;align-items:stretch;font:800 16px Arial;color:#111;box-shadow:8px 0 28px rgba(0,0,0,.18);transform:translateX(-105%);transition:transform .18s ease}
    .voicePanel.open{transform:translateX(0)}
    .voicePanel label{font:900 14px Arial;text-transform:uppercase}
    .voicePanel select,.voicePanel button{position:static;width:auto;height:48px;border-radius:12px;border:1px solid rgba(0,0,0,.22);background:#fff;color:#111;font:800 16px Arial;text-transform:none;padding:0 12px;display:block}
    .voicePanel button{background:#111;color:#fff}
    .voicePanel .closeSettings{background:#eee;color:#111;width:48px;padding:0;font-size:24px;align-self:flex-end}
    .installSection{display:flex;flex-direction:column;gap:8px}
    .installSection h2{margin:4px 0 0;font:900 14px Arial;text-transform:uppercase}
    .offlineStatus{font:800 14px Arial;color:#111;background:#f1f1f1;border:1px solid rgba(0,0,0,.16);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:12px}
    .modalBackdrop{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:calc(18px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));background:rgba(10,10,12,.34);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    .modalBackdrop.open{display:flex}
    .installModal{position:relative;width:min(560px,100%);max-height:100%;overflow:auto;background:#fff;color:#111;border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.28);padding:24px;font:700 17px/1.42 Arial;text-align:left}
    .installModal h2{margin:0 44px 16px 0;font:900 24px/1.15 Arial}
    .installModal ol{margin:0 0 22px 22px;padding:0}
    .installModal li{margin:0 0 10px}
    .installModal .stepNote{display:block;margin-top:8px}
    .installModal .modalCloseIcon{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:19px;background:#eee;color:#111;border:0;font:900 24px Arial;padding:0;display:flex;align-items:center;justify-content:center}
    .installModal .modalCloseButton{position:static;width:100%;height:48px;border-radius:14px;background:#111;color:#fff;border:0;font:900 16px Arial;display:flex;align-items:center;justify-content:center;padding:0 12px}
  </style>
</head>
<body>
  <div id="rotateHint">Поверни телефон горизонтально</div>
  <main class="app" id="app"><section class="board" id="board"></section></main>
  <button class="settingsToggle" id="settingsToggle" type="button" aria-label="Налаштування">⚙</button>
  <div class="voicePanel" id="voicePanel">
    <button class="closeSettings" id="closeSettings" type="button" aria-label="Закрити">×</button>
    <label for="languageSelect">Мова</label>
    <select id="languageSelect"></select>
    <section class="installSection" aria-labelledby="installGuideTitle">
      <h2 id="installGuideTitle">Інструкція зі встановлення</h2>
      <button id="iphoneInstallGuide" type="button">🍎 iPhone / iPad</button>
      <button id="androidInstallGuide" type="button">🤖 Android</button>
    </section>
    <div class="offlineStatus" aria-live="polite"><span>Offline cache:</span><span id="offlineCacheStatus">Preparing...</span></div>
  </div>
  <div class="modalBackdrop" id="installModalBackdrop">
    <div class="installModal" role="dialog" aria-modal="true" aria-labelledby="installModalTitle">
      <button class="modalCloseIcon" id="installModalCloseIcon" type="button" aria-label="Закрити">×</button>
      <h2 id="installModalTitle"></h2>
      <ol id="installModalSteps"></ol>
      <button class="modalCloseButton" id="installModalCloseButton" type="button">Закрити</button>
    </div>
  </div>

<script src="commands.js"></script>
<script>
const board = document.getElementById('board');
const app = document.getElementById('app');
const BOARD_WIDTH = 1600;
const BOARD_HEIGHT = 900;
const COMMANDS = window.FPV_COMMANDS || [];
const COMMAND_BY_ID = Object.fromEntries(COMMANDS.map(command=>[command.id, command]));
const APP_LANGUAGES = window.FPV_LANGUAGES || [['uk-UA','Українська']];
const AUDIO_LANGUAGES = new Set(['uk-UA','es-ES','en-US']);
const HIDDEN_LABEL_COMMANDS = new Set([
  'throttle_up_large',
  'throttle_up_medium',
  'throttle_up_small',
  'throttle_down_small',
  'throttle_down_medium',
  'throttle_down_large',
  'yaw_left_large',
  'yaw_left_medium',
  'yaw_left_small',
  'yaw_right_small',
  'yaw_right_medium',
  'yaw_right_large',
  'roll_left_large',
  'roll_left_medium',
  'roll_left_small',
  'roll_right_small',
  'roll_right_medium',
  'roll_right_large',
  'pitch_up_large',
  'pitch_up_medium',
  'pitch_up_small',
  'pitch_down_small',
  'pitch_down_medium',
  'pitch_down_large'
]);
let currentAudio = null;
let currentAudioToken = 0;
let didWarmAudioCache = false;
let scaleFrame = null;

function scaleBoard(){
  scaleFrame=null;
  const rect=app.getBoundingClientRect();
  const scale=Math.min(1, rect.width / BOARD_WIDTH, rect.height / BOARD_HEIGHT);
  const x=(rect.width - BOARD_WIDTH * scale) / 2;
  const y=(rect.height - BOARD_HEIGHT * scale) / 2;
  board.style.transform=`translate(${x}px, ${y}px) scale(${scale})`;
}

function requestScaleBoard(){
  if(scaleFrame !== null) return;
  scaleFrame=requestAnimationFrame(scaleBoard);
}

function makeButton(command){
  const b=document.createElement('button');
  b.style.left=command.x+'px';b.style.top=command.y+'px';b.style.width=command.width+'px';b.style.height=command.height+'px';
  b.className=command.className;
  b.innerText=HIDDEN_LABEL_COMMANDS.has(command.id) ? '' : command.buttonLabel || command.speechUk || '';
  b.dataset.command=command.id;
  b.addEventListener('click',()=>speakCommand(command.id));
  board.appendChild(b);
}
COMMANDS.forEach(makeButton);
requestScaleBoard();

window.addEventListener('load',requestScaleBoard);
window.addEventListener('resize',requestScaleBoard);
window.addEventListener('orientationchange',requestScaleBoard);
window.addEventListener('pageshow',requestScaleBoard);
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden) requestScaleBoard();
});
if(window.visualViewport){
  visualViewport.addEventListener('resize',requestScaleBoard);
  visualViewport.addEventListener('scroll',requestScaleBoard);
}

const languageSelect=document.getElementById('languageSelect');
const settingsToggle=document.getElementById('settingsToggle');
const voicePanel=document.getElementById('voicePanel');
const closeSettings=document.getElementById('closeSettings');
const offlineCacheStatus=document.getElementById('offlineCacheStatus');
const iphoneInstallGuide=document.getElementById('iphoneInstallGuide');
const androidInstallGuide=document.getElementById('androidInstallGuide');
const installModalBackdrop=document.getElementById('installModalBackdrop');
const installModalTitle=document.getElementById('installModalTitle');
const installModalSteps=document.getElementById('installModalSteps');
const installModalCloseIcon=document.getElementById('installModalCloseIcon');
const installModalCloseButton=document.getElementById('installModalCloseButton');
settingsToggle.addEventListener('click',()=>voicePanel.classList.toggle('open'));
closeSettings.addEventListener('click',()=>voicePanel.classList.remove('open'));

APP_LANGUAGES.filter(([code])=>AUDIO_LANGUAGES.has(code)).forEach(([code,name])=>{
  const option=document.createElement('option');
  option.value=code;
  option.textContent=name;
  languageSelect.appendChild(option);
});
const savedLanguage=localStorage.getItem('fpvVoiceLanguage');
languageSelect.value=AUDIO_LANGUAGES.has(savedLanguage) ? savedLanguage : 'uk-UA';

function audioPath(commandId, lang=languageSelect.value){
  return `audio/${lang}/${commandId}.mp3`;
}

function stopCurrentAudio(){
  if(!currentAudio) return;
  try {
    currentAudio.pause();
    currentAudio.removeAttribute('src');
    currentAudio.load();
  } catch {}
  currentAudio = null;
}

function warmAudioCache(){
  // iOS Safari often ignores HTMLAudioElement preload for many files.
  // Fetch warming is safer and lets the Service Worker / HTTP cache store files
  // without creating 159 active audio elements.
  AUDIO_LANGUAGES.forEach((lang)=>{
    COMMANDS.forEach((command)=>{
      const src=audioPath(command.id, lang);
      fetch(src, {cache:'force-cache'}).catch(()=>{});
    });
  });
}

function speak(text, lang=languageSelect.value){
  if (!('speechSynthesis' in window)) { alert('Speech synthesis is not supported'); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang;
  u.rate=1.2;
  u.pitch=0.9;
  u.volume=1;
  speechSynthesis.speak(u);
}

function fallbackSpeech(command, lang=languageSelect.value){
  const translated=window.FPV_TRANSLATIONS?.[lang]?.[command.speechKey];
  speak(translated || command.speechUk || command.buttonLabel || command.id, lang);
}

function speakCommand(commandId){
  const command=COMMAND_BY_ID[commandId];
  if(!command) return;

  const src=audioPath(command.id);
  const token=++currentAudioToken;
  let handledError=false;

  if('speechSynthesis' in window) speechSynthesis.cancel();
  stopCurrentAudio();

  const audio=new Audio();
  audio.preload='auto';
  audio.src=src;
  currentAudio=audio;

  audio.onerror=()=>{
    if(token !== currentAudioToken) return;
    if(handledError) return;
    handledError=true;
    console.warn(`Missing audio: ${src}`);
    fallbackSpeech(command);
  };

  audio.onended=()=>{
    if(token === currentAudioToken) currentAudio=null;
  };

  audio.play().catch((error)=>{
    if(token !== currentAudioToken) return;
    if(handledError) return;
    handledError=true;
    console.warn(`Audio playback failed: ${src}`, error);
    fallbackSpeech(command);
  });
}

window.addEventListener('pointerdown',()=>{
  if(didWarmAudioCache) return;
  didWarmAudioCache=true;
  warmAudioCache();
},{once:true});

window.addEventListener('touchstart',()=>{
  if(didWarmAudioCache) return;
  didWarmAudioCache=true;
  warmAudioCache();
},{once:true});

languageSelect.addEventListener('change',()=>{
  localStorage.setItem('fpvVoiceLanguage', languageSelect.value);
  stopCurrentAudio();
});

const INSTALL_GUIDES = {
  ios: {
    title: 'Встановлення на iPhone / iPad',
    steps: [
      'Відкрийте цей сайт у Safari.',
      'Натисніть кнопку «Поділитися».',
      'Оберіть «На початковий екран».',
      'Натисніть «Додати».',
      'Запустіть застосунок з іконки на головному екрані.',
      'Під час першого запуску дочекайтеся, поки статус «Offline Cache» зміниться на «Ready».',
      'Після цього застосунок працюватиме навіть без підключення до Інтернету.'
    ]
  },
  android: {
    title: 'Встановлення на Android',
    steps: [
      'Відкрийте цей сайт у Google Chrome.',
      'Відкрийте меню Chrome (⋮).',
      {
        text: 'Оберіть «Встановити застосунок».',
        note: 'Якщо такого пункту немає — оберіть «Додати на головний екран».'
      },
      'Підтвердьте встановлення.',
      'Запустіть застосунок з іконки на головному екрані.',
      'Під час першого запуску дочекайтеся, поки статус «Offline Cache» зміниться на «Ready».',
      'Після цього застосунок працюватиме навіть без підключення до Інтернету.'
    ]
  }
};

function openInstallGuide(type){
  const guide=INSTALL_GUIDES[type];
  installModalTitle.textContent=guide.title;
  installModalSteps.innerHTML='';
  guide.steps.forEach((step)=>{
    const item=document.createElement('li');
    if(typeof step === 'string'){
      item.textContent=step;
    }else{
      item.textContent=step.text;
      const note=document.createElement('span');
      note.className='stepNote';
      note.textContent=step.note;
      item.appendChild(note);
    }
    installModalSteps.appendChild(item);
  });
  installModalBackdrop.classList.add('open');
  installModalCloseButton.focus();
}

function closeInstallGuide(){
  installModalBackdrop.classList.remove('open');
}

iphoneInstallGuide.addEventListener('click',()=>openInstallGuide('ios'));
androidInstallGuide.addEventListener('click',()=>openInstallGuide('android'));
installModalCloseIcon.addEventListener('click',closeInstallGuide);
installModalCloseButton.addEventListener('click',closeInstallGuide);
installModalBackdrop.addEventListener('click',(event)=>{
  if(event.target === installModalBackdrop) closeInstallGuide();
});
window.addEventListener('keydown',(event)=>{
  if(event.key === 'Escape') closeInstallGuide();
});

function setOfflineStatus(status){
  offlineCacheStatus.textContent=status;
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message',(event)=>{
    if(event.data?.type === 'OFFLINE_CACHE_STATUS') setOfflineStatus(event.data.status);
  });

  navigator.serviceWorker.register('./service-worker.js')
    .then((registration)=>navigator.serviceWorker.ready.then(()=>{
      const worker=navigator.serviceWorker.controller || registration.active;
      worker?.postMessage({type:'CHECK_OFFLINE_CACHE'});
    }))
    .catch(()=>{
      setOfflineStatus('Error');
    });
}else{
  setOfflineStatus('Error');
}
</script>
</body>
</html>
