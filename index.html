<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="FPV Voice" />
  <title>FPV Voice Commands</title>
  <style>
    :root{
      --bg:#f5f5f5;
      --purple:#a51685;
      --red:#c33535;
      --red2:#c95f5f;
      --red3:#d58383;
      --blue:#3a82e5;
      --blue2:#82aeea;
      --blue3:#aac7ef;
      --green:#33a44f;
      --green2:#73bd80;
      --green3:#b4dbba;
      --yellow:#ecb930;
      --yellow2:#f0cf7e;
      --yellow3:#f5dfa8;
      --gray:#d8d8d8;
      --black:#0c0c0c;
      --white:#fff;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Arial, Helvetica, sans-serif;color:var(--black)}
    body{position:fixed;inset:0}
    .app{position:relative;width:100vw;height:100vh;background:var(--bg);overflow:hidden;transform-origin:top left}
    .board{position:absolute;left:0;top:0;width:1600px;height:900px;background:var(--bg)}
    button{position:absolute;border:0;border-radius:22px;font-weight:900;text-transform:none;text-align:center;line-height:1.08;font-size:26px;padding:0 14px;display:flex;align-items:center;justify-content:center;color:var(--black);box-shadow:none;cursor:pointer;user-select:none;-webkit-user-select:none}
    button:active{transform:scale(.96);filter:brightness(.92)}
    .top{background:var(--purple);color:var(--white);font-size:24px;border-radius:20px}
    .red{background:var(--red);color:var(--white)} .red2{background:var(--red2);color:var(--white)} .red3{background:var(--red3);color:var(--white)}
    .blue{background:var(--blue)} .blue2{background:var(--blue2)} .blue3{background:var(--blue3)}
    .green{background:var(--green)} .green2{background:var(--green2)} .green3{background:var(--green3)}
    .yellow{background:var(--yellow)} .yellow2{background:var(--yellow2)} .yellow3{background:var(--yellow3)}
    .gray{background:var(--gray)} .white{background:#fff}
    .pill{border-radius:18px}
    .vertical{writing-mode:vertical-rl;text-orientation:mixed}
    .small{font-size:22px}.mid{font-size:24px}.big{font-size:28px}
    #rotateHint{display:none;position:fixed;inset:0;background:#111;color:white;z-index:20;align-items:center;justify-content:center;text-align:center;font:800 26px/1.25 Arial;padding:30px}
    .settingsToggle{position:fixed;left:calc(12px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));z-index:12;width:58px;height:58px;border-radius:18px;background:#111;color:#fff;font:900 26px Arial;border:0;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.22);text-transform:none;padding:0}
    .settingsToggle:active{transform:scale(.96)}
    .voicePanel{position:fixed;left:0;top:0;bottom:0;width:min(360px,86vw);z-index:11;background:rgba(255,255,255,.97);border-right:1px solid rgba(0,0,0,.18);padding:calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;align-items:stretch;font:800 16px Arial;color:#111;box-shadow:8px 0 28px rgba(0,0,0,.18);transform:translateX(-105%);transition:transform .18s ease}
    .voicePanel.open{transform:translateX(0)}
    .voicePanel label{font:900 14px Arial;text-transform:uppercase}
    .voicePanel select,.voicePanel button{position:static;width:auto;height:48px;border-radius:12px;border:1px solid rgba(0,0,0,.22);background:#fff;color:#111;font:800 16px Arial;text-transform:none;padding:0 12px;display:block}
    .voicePanel button{background:#111;color:#fff}
    .voicePanel .closeSettings{background:#eee;color:#111;width:48px;padding:0;font-size:24px;align-self:flex-end}
    @media (orientation:portrait){#rotateHint{display:flex}.app{display:none}.voicePanel,.settingsToggle{display:none}}
  </style>
</head>
<body>
  <div id="rotateHint">Поверни телефон горизонтально</div>
  <main class="app" id="app"><section class="board" id="board"></section></main>
  <button class="settingsToggle" id="settingsToggle" type="button" aria-label="Налаштування">⚙</button>
  <div class="voicePanel" id="voicePanel">
    <button class="closeSettings" id="closeSettings" type="button" aria-label="Закрити">×</button>
    <label for="languageSelect">Мова</label>
    <select id="languageSelect"></select>
    <label for="voiceMode">Голос</label>
    <select id="voiceMode">
      <option value="auto">Auto</option>
      <option value="male" selected>Чоловічий</option>
      <option value="female">Жіночий</option>
    </select>
    <label for="voiceSelect">Системний голос</label>
    <select id="voiceSelect" title="Системний голос"></select>
    <button id="testVoice" type="button">Тест</button>
    <button id="testMp3" type="button">▶ Test MP3</button>
  </div>

<script src="commands.js"></script>
<script>
const board = document.getElementById('board');
const COMMANDS = window.FPV_COMMANDS || [];
const COMMAND_BY_ID = Object.fromEntries(COMMANDS.map(command=>[command.id, command]));
const APP_LANGUAGES = window.FPV_LANGUAGES || [['uk-UA','Українська']];

function makeButton(command){
  const b=document.createElement('button');
  b.style.left=command.x+'px';b.style.top=command.y+'px';b.style.width=command.width+'px';b.style.height=command.height+'px';
  b.className=command.className;
  b.innerText=command.buttonLabel ? command.id+'\n'+command.buttonLabel : command.id;
  b.dataset.command=command.id;
  b.addEventListener('click',()=>speakCommand(command.id));
  board.appendChild(b);
}
COMMANDS.forEach(makeButton);

let voices=[];
const languageSelect=document.getElementById('languageSelect');
const voiceMode=document.getElementById('voiceMode');
const voiceSelect=document.getElementById('voiceSelect');
const testVoice=document.getElementById('testVoice');
const testMp3=document.getElementById('testMp3');
const settingsToggle=document.getElementById('settingsToggle');
const voicePanel=document.getElementById('voicePanel');
const closeSettings=document.getElementById('closeSettings');
settingsToggle.addEventListener('click',()=>voicePanel.classList.toggle('open'));
closeSettings.addEventListener('click',()=>voicePanel.classList.remove('open'));

APP_LANGUAGES.forEach(([code,name])=>{
  const option=document.createElement('option');
  option.value=code;
  option.textContent=name;
  languageSelect.appendChild(option);
});
languageSelect.value=localStorage.getItem('fpvVoiceLanguage') || 'es-ES';

function languageRoot(){ return languageSelect.value.split('-')[0].toLowerCase(); }
function isCurrentLanguageVoice(v){ return (v.lang || '').split(/[-_]/)[0].toLowerCase() === languageRoot(); }
function isMaleVoice(v){ return /jorge|diego|carlos|juan|pablo|miguel|antonio|male|hombre|mascul/i.test(v.name || ''); }
function isFemaleVoice(v){ return /paulina|monica|mónica|luciana|marisol|samantha|female|mujer|fem/i.test(v.name || ''); }

function loadVoices(){
  if (!('speechSynthesis' in window)) return;
  voices=(speechSynthesis.getVoices()||[]).filter(isCurrentLanguageVoice);
  renderVoiceSelect();
}

function renderVoiceSelect(){
  const current=voiceSelect.value;
  voiceSelect.innerHTML='';
  const auto=document.createElement('option');
  auto.value='';
  auto.textContent='Auto';
  voiceSelect.appendChild(auto);
  voices.forEach((v,i)=>{
    const o=document.createElement('option');
    o.value=String(i);
    o.textContent=`${v.name} · ${v.lang}`;
    voiceSelect.appendChild(o);
  });
  if([...voiceSelect.options].some(o=>o.value===current)) voiceSelect.value=current;
}

loadVoices();
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged=loadVoices;

function pickVoice(){
  const selectedIndex=voiceSelect.value;
  if(selectedIndex !== '' && voices[Number(selectedIndex)]) return voices[Number(selectedIndex)];

  const mode=voiceMode.value;
  if(mode==='male'){
    return voices.find(isMaleVoice) || voices.find(v=>!isFemaleVoice(v)) || voices[0] || null;
  }
  if(mode==='female'){
    return voices.find(isFemaleVoice) || voices[0] || null;
  }
  return voices[0] || null;
}

function speak(text, lang=languageSelect.value){
  if (!('speechSynthesis' in window)) { alert('Speech synthesis is not supported'); return; }
  loadVoices();
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang;
  u.rate=0.96;
  u.pitch=0.88;
  u.volume=1;
  const v=pickVoice();
  if(v) u.voice=v;
  speechSynthesis.speak(u);
}

function speakCommand(commandId){
  const command=COMMAND_BY_ID[commandId];
  if(!command || !command.speechUk) return;
  speak(command.speechUk, 'uk-UA');
}

testVoice.addEventListener('click',()=>speakCommand('yaw_right_large'));
testMp3.addEventListener('click',()=>{
  const audio=new Audio('audio/uk-UA/test.mp3');
  let shown=false;
  const showMissing=()=>{
    if(shown) return;
    shown=true;
    alert('Test audio not found.');
  };
  audio.addEventListener('error',showMissing,{once:true});
  audio.play().catch(showMissing);
});
languageSelect.addEventListener('change',()=>{
  localStorage.setItem('fpvVoiceLanguage', languageSelect.value);
  voiceSelect.value='';
  loadVoices();
  speakCommand('hold_altitude');
});
voiceMode.addEventListener('change',()=>speakCommand('pitch_up_medium'));
voiceSelect.addEventListener('change',()=>speakCommand('falling_throttle_up'));

// unlock iOS voices on first touch
window.addEventListener('touchstart',()=>{loadVoices();},{once:true});
</script>
</body>
</html>
