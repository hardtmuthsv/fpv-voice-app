<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="FPV Voice" />
  <title>FPV Voice Commands</title>
  <style>
    :root{
      --bg:#f5f5f5;
      --purple:#a51685;
      --red:#c33535;
      --red2:#c95f5f;
      --red3:#d58383;
      --blue:#3a82e5;
      --blue2:#82aeea;
      --blue3:#aac7ef;
      --green:#33a44f;
      --green2:#73bd80;
      --green3:#b4dbba;
      --yellow:#ecb930;
      --yellow2:#f0cf7e;
      --yellow3:#f5dfa8;
      --gray:#d8d8d8;
      --black:#0c0c0c;
      --white:#fff;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Arial, Helvetica, sans-serif;color:var(--black)}
    body{position:fixed;inset:0}
    .app{position:relative;width:100vw;height:100vh;background:var(--bg);overflow:hidden;transform-origin:top left}
    .board{position:absolute;left:0;top:0;width:1600px;height:900px;background:var(--bg)}
    button{position:absolute;border:0;border-radius:22px;font-weight:900;text-transform:uppercase;text-align:center;line-height:1.08;font-size:26px;padding:0 14px;display:flex;align-items:center;justify-content:center;color:var(--black);box-shadow:none;cursor:pointer;user-select:none;-webkit-user-select:none}
    button:active{transform:scale(.96);filter:brightness(.92)}
    .top{background:var(--purple);color:var(--white);font-size:24px;border-radius:20px}
    .red{background:var(--red);color:var(--white)} .red2{background:var(--red2);color:var(--white)} .red3{background:var(--red3);color:var(--white)}
    .blue{background:var(--blue)} .blue2{background:var(--blue2)} .blue3{background:var(--blue3)}
    .green{background:var(--green)} .green2{background:var(--green2)} .green3{background:var(--green3)}
    .yellow{background:var(--yellow)} .yellow2{background:var(--yellow2)} .yellow3{background:var(--yellow3)}
    .gray{background:var(--gray)} .white{background:#fff}
    .pill{border-radius:18px}
    .vertical{writing-mode:vertical-rl;text-orientation:mixed}
    .small{font-size:22px}.mid{font-size:24px}.big{font-size:28px}
    #rotateHint{display:none;position:fixed;inset:0;background:#111;color:white;z-index:20;align-items:center;justify-content:center;text-align:center;font:800 26px/1.25 Arial;padding:30px}
    .settingsToggle{position:fixed;left:12px;bottom:12px;z-index:12;width:58px;height:58px;border-radius:18px;background:#111;color:#fff;font:900 26px Arial;border:0;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.22);text-transform:none;padding:0}
    .settingsToggle:active{transform:scale(.96)}
    .voicePanel{position:fixed;left:12px;bottom:82px;z-index:11;background:rgba(255,255,255,.96);border:1px solid rgba(0,0,0,.18);border-radius:18px;padding:14px;display:none;gap:10px;align-items:center;font:800 16px Arial;color:#111;box-shadow:0 8px 28px rgba(0,0,0,.18)}
    .voicePanel.open{display:flex}
    .voicePanel select,.voicePanel button{position:static;width:auto;height:48px;border-radius:12px;border:1px solid rgba(0,0,0,.22);background:#fff;color:#111;font:800 16px Arial;text-transform:none;padding:0 12px;display:block}
    .voicePanel button{background:#111;color:#fff}
    .voicePanel .closeSettings{background:#eee;color:#111;width:48px;padding:0;font-size:24px}
    @media (orientation:portrait){#rotateHint{display:flex}.app{display:none}.voicePanel,.settingsToggle{display:none}}
  </style>
</head>
<body>
  <div id="rotateHint">Поверни телефон горизонтально</div>
  <main class="app" id="app"><section class="board" id="board"></section></main>
  <button class="settingsToggle" id="settingsToggle" type="button" aria-label="Налаштування">⚙</button>
  <div class="voicePanel" id="voicePanel">
    <label for="languageSelect">Мова</label>
    <select id="languageSelect">
      <option value="uk-UA">Українська</option><option value="en-US">English</option><option value="es-ES" selected>Español</option><option value="fr-FR">Français</option><option value="de-DE">Deutsch</option><option value="it-IT">Italiano</option><option value="pt-PT">Português</option><option value="nl-NL">Nederlands</option><option value="pl-PL">Polski</option><option value="cs-CZ">Čeština</option><option value="sk-SK">Slovenčina</option><option value="sl-SI">Slovenščina</option><option value="hr-HR">Hrvatski</option><option value="sr-RS">Srpski</option><option value="bs-BA">Bosanski</option><option value="ro-RO">Română</option><option value="hu-HU">Magyar</option><option value="et-EE">Eesti</option><option value="lv-LV">Latviešu</option><option value="lt-LT">Lietuvių</option><option value="fi-FI">Suomi</option><option value="sv-SE">Svenska</option><option value="nb-NO">Norsk</option><option value="da-DK">Dansk</option><option value="is-IS">Íslenska</option><option value="el-GR">Ελληνικά</option><option value="tr-TR">Türkçe</option><option value="ko-KR">한국어</option><option value="ja-JP">日本語</option><option value="zh-CN">中文（简体）</option><option value="zh-TW">中文（繁體）</option>
    </select>
    <label for="voiceMode">Голос</label>
    <select id="voiceMode">
      <option value="auto">Auto</option>
      <option value="male" selected>Чоловічий</option>
      <option value="female">Жіночий</option>
    </select>
    <select id="voiceSelect" title="Системний голос"></select>
    <button id="testVoice" type="button">Тест</button>
    <button class="closeSettings" id="closeSettings" type="button" aria-label="Закрити">×</button>
  </div>

<script>
const board = document.getElementById('board');

const buttons = [
  // top bar
  [36,55,92,118,'ARM','top','Armar.'],
  [143,55,132,118,'DISARM','top','Desarmar.'],
  [296,55,215,118,'ПОТУЖНІСТЬ\nVTX','top','Potencia VTX.'],
  [528,55,192,118,'БАТАРЕЯ','top','Batería.'],
  [735,55,190,118,'КАМЕРА 0','top','Cámara cero.'],
  [938,55,187,118,'КАМЕРА 45','top','Cámara cuarenta y cinco.'],
  [1140,55,188,118,'КАМЕРА 90','top','Cámara noventa.'],
  [1345,55,245,118,'ІНВЕРСІЯ\nКЕРУВАННЯ','top','Inversión de control.'],

  // left red throttle urgent
  [36,213,246,116,'МИ ПАДАЄМО\nДАЙ ГАЗ ВГОРУ','red','Estamos cayendo. Throttle más fuerte.'],
  [36,346,246,116,'ДРОН ТРЯСЕ\nTHROTTLE ВГОРУ','red','El drone tiembla. Throttle arriba.'],

  // throttle block
  [313,213,137,66,'','red','Throttle arriba grande.'],
  [313,303,137,66,'','red2','Throttle arriba mediano.'],
  [313,392,137,66,'','red3','Throttle arriba chico.'],
  [473,213,246,116,'THROTTLE\n90','red','Throttle noventa.'],
  [473,342,246,116,'THROTTLE\n60','red2','Throttle sesenta.'],
  [313,635,137,66,'','red3','Throttle abajo chico.'],
  [313,724,137,66,'','gray','Throttle abajo mediano.'],
  [313,814,137,66,'','white','Throttle abajo grande.'],
  [473,768,246,116,'ПОВІЛЬНО ВНИЗ\nTHROTTLE','gray','Throttle abajo despacio.'],
  [747,213,132,116,'МАЛО\nTHROTTLE','gray','Poco throttle.'],
  [747,346,132,116,'БАГАТО\nTHROTTLE','gray','Mucho throttle.'],

  // yaw/roll blue
  [36,478,68,136,'','blue','Yaw izquierda grande.'],
  [127,478,68,136,'','blue2','Yaw izquierda mediano.'],
  [218,478,68,136,'','blue3','Yaw izquierda chico.'],
  [36,635,247,116,'ПОВЕРТАЄМО\nЛІВОРУЧ','blue2','Yaw izquierda mediano.'],
  [473,478,68,136,'','blue3','Yaw derecha chico.'],
  [563,478,68,136,'','blue2','Yaw derecha mediano.'],
  [653,478,68,136,'','blue','Yaw derecha grande.'],
  [473,635,247,116,'ПОВЕРТАЄМО\nПРАВОРУЧ','blue2','Yaw derecha mediano.'],
  [36,768,246,116,'НЕ НАБИРАЙ\nШВИДКО ВИСОТУ','gray','No subas muy rápido.'],

  // altitude gray
  [747,489,132,116,'ВИСОТА\n500','gray','Altura quinientos.'],
  [747,635,132,116,'ВИСОТА\n300','gray','Altura trescientos.'],
  [747,768,132,116,'ВИСОТА\n200','gray','Altura doscientos.'],

  // center green/yellow commands
  [908,213,246,116,'ТРИМАЙ ВИСОТУ','green2','Mantén la altura.'],
  [908,342,246,116,'НЕ ЛІТАЙ ЗАДОМ','green2','No vueles hacia atrás.'],
  [908,635,246,116,'ВИРІВНЯЙ\nГОРИЗОНТ','yellow2','Nivela el horizonte.'],
  [908,768,246,116,'ПІДНІМИ НІС\nДРОНА','green2','Pitch arriba. Sube la nariz del drone.'],

  // pitch green/yellow
  [1185,213,137,66,'','green','Pitch arriba grande.'],
  [1185,303,137,66,'','green2','Pitch arriba mediano.'],
  [1185,392,137,66,'','green3','Pitch arriba chico.'],
  [1185,635,137,66,'','green3','Pitch abajo chico.'],
  [1185,724,137,66,'','green2','Pitch abajo mediano.'],
  [1185,814,137,66,'','green','Pitch abajo grande.'],

  // right pitch block
  [1342,213,247,116,'ТРЕБА\nЛЕТІТИ ВПЕРЕД','gray','Hay que volar hacia adelante.'],
  [1342,342,247,116,'PITCH\nВПЕРЕД','green2','Pitch adelante.'],
  [1342,478,68,136,'','yellow3','Roll derecha chico.'],
  [1432,478,68,136,'','yellow2','Roll derecha mediano.'],
  [1523,478,68,136,'','yellow','Roll derecha grande.'],
  [1342,635,247,116,'ДРОН НАХИЛЕНИЙ','gray','El drone está inclinado.'],
  [1342,768,247,116,'PITCH\nНАЗАД','green2','Pitch atrás.'],
  [908,478,68,136,'','yellow','Roll izquierda grande.'],
  [998,478,68,136,'','yellow2','Roll izquierda mediano.'],
  [1088,478,68,136,'','yellow3','Roll izquierda chico.'],
];

function makeButton([x,y,w,h,label,cls,say]){
  const b=document.createElement('button');
  b.style.left=x+'px';b.style.top=y+'px';b.style.width=w+'px';b.style.height=h+'px';
  b.className=cls;
  b.innerText=label;
  b.dataset.say=say;
  b.addEventListener('click',()=>speak(say));
  board.appendChild(b);
}
buttons.forEach(makeButton);

function fit(){
  const app=document.getElementById('app');
  const scale=Math.min(window.innerWidth/1600, window.innerHeight/900);
  board.style.transform=`scale(${scale})`;
  board.style.transformOrigin='top left';
  board.style.left=((window.innerWidth-1600*scale)/2)+'px';
  board.style.top=((window.innerHeight-900*scale)/2)+'px';
}
window.addEventListener('resize',fit);fit();

let voices=[];
const voiceMode=document.getElementById('voiceMode');
const languageSelect=document.getElementById('languageSelect');
const voiceSelect=document.getElementById('voiceSelect');
const testVoice=document.getElementById('testVoice');
const settingsToggle=document.getElementById('settingsToggle');
const voicePanel=document.getElementById('voicePanel');
const closeSettings=document.getElementById('closeSettings');
settingsToggle.addEventListener('click',()=>voicePanel.classList.toggle('open'));
closeSettings.addEventListener('click',()=>voicePanel.classList.remove('open'));

function currentLangPrefix(){return languageSelect.value.split('-')[0].toLowerCase();}
function isSpanishVoice(v){return (v.lang||'').toLowerCase().startsWith(currentLangPrefix());}
function isMaleVoice(v){ return /jorge|diego|carlos|juan|pablo|miguel|antonio|male|hombre|mascul/i.test(v.name || ''); }
function isFemaleVoice(v){ return /paulina|monica|mónica|luciana|marisol|samantha|female|mujer|fem/i.test(v.name || ''); }

function loadVoices(){
  voices=(speechSynthesis.getVoices()||[]).filter(isSpanishVoice);
  renderVoiceSelect();
}

function renderVoiceSelect(){
  const current=voiceSelect.value;
  voiceSelect.innerHTML='';
  const auto=document.createElement('option');
  auto.value='';
  auto.textContent='Auto Spanish';
  voiceSelect.appendChild(auto);
  voices.forEach((v,i)=>{
    const o=document.createElement('option');
    o.value=String(i);
    o.textContent=`${v.name} · ${v.lang}`;
    voiceSelect.appendChild(o);
  });
  if([...voiceSelect.options].some(o=>o.value===current)) voiceSelect.value=current;
}

loadVoices();
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged=loadVoices;

function pickSpanishVoice(){
  const selectedIndex=voiceSelect.value;
  if(selectedIndex !== '' && voices[Number(selectedIndex)]) return voices[Number(selectedIndex)];

  const mode=voiceMode.value;
  if(mode==='male'){
    return voices.find(isMaleVoice) || voices.find(v=>!isFemaleVoice(v)) || voices[0] || null;
  }
  if(mode==='female'){
    return voices.find(isFemaleVoice) || voices[0] || null;
  }
  return voices[0] || null;
}

function speak(text){
  if (!('speechSynthesis' in window)) { alert('Speech synthesis is not supported'); return; }
  loadVoices();
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=languageSelect.value;
  u.rate=0.96;
  u.pitch=0.88;
  u.volume=1;
  const v=pickSpanishVoice();
  if(v) u.voice=v;
  speechSynthesis.speak(u);
}

testVoice.addEventListener('click',()=>speak('Yaw derecha grande.'));
voiceMode.addEventListener('change',()=>speak('Pitch arriba mediano.'));
voiceSelect.addEventListener('change',()=>speak('Throttle más fuerte.'));

// unlock iOS voices on first touch
window.addEventListener('touchstart',()=>{loadVoices();},{once:true});
</script>
</body>
</html>
